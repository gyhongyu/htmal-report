<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>報告加載中...</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0f17;
            color: #94a3b8;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-text-size-adjust: 100%;
        }
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
            background-color: #0b0f17;
            transition: opacity 0.25s ease-out;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(56, 189, 248, 0.2);
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .error-msg {
            color: #f87171;
            font-size: 1.1rem;
            max-width: 90vw;
            text-align: center;
            line-height: 1.6;
        }
        #report-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: none;
            z-index: 20;
            background-color: #ffffff;
            -webkit-overflow-scrolling: touch;
        }
    </style>
</head>
<body>
    <div id="loader" class="loading-container">
        <div class="spinner"></div>
        <div>正在安全載入報告內容...</div>
    </div>

    <!-- iOS Safari 與跨平台 100% 滿版無損 iframe -->
    <iframe
        id="report-frame"
        title="HTML Report Preview"
        sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-downloads allow-modals"
    ></iframe>

    <script>
        const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbxcSYXocdTxhvYRq0A5eXsJqYvOI0xImay63Au9FSmolEwlbJ0My5Gr0aWUcvVpx8AiIA/exec';

        async function initPreview() {
            const urlParams = new URLSearchParams(window.location.search);
            const reportId = urlParams.get('id');
            const driveIdParam = urlParams.get('driveId');

            if (!reportId && !driveIdParam) {
                showError('無效的報告連結 (缺少 ID)');
                return;
            }

            try {
                let targetDriveId = driveIdParam;

                // 如果只給了 reportId，優先從本地快取中查找 driveId，秒級跳過 list 請求
                if (!targetDriveId && reportId) {
                    try {
                        const cached = localStorage.getItem('htmal_cloud_reports_cache');
                        if (cached) {
                            const parsed = JSON.parse(cached);
                            if (Array.isArray(parsed)) {
                                const found = parsed.find(r => r.id === reportId);
                                if (found && found.driveId) {
                                    targetDriveId = found.driveId;
                                }
                            }
                        }
                    } catch (e) {}

                    // 若快取未命中，再向 GAS 查出對應的 driveId
                    if (!targetDriveId) {
                        const listResp = await fetch(`${GAS_API_URL}?action=list&v=${Date.now()}`, { cache: 'no-store' });
                        const listData = await listResp.json();
                        const report = listData.reports && listData.reports.find(r => r.id === reportId);
                        
                        if (report && report.driveId) {
                            targetDriveId = report.driveId;
                        } else {
                            targetDriveId = reportId;
                        }
                    }
                }

                // 透過 GAS 讀取 Google Drive 完整 HTML 代碼 (針對 iOS Safari 跨域 302 轉址加固)
                const getUrl = `${GAS_API_URL}?action=get&driveId=${targetDriveId}&v=${Date.now()}`;
                
                let htmlContent = '';
                let fetchError = null;

                // 雙保險重試機制 (容忍 Safari 冷啟動與行動端網路抖動)
                for (let attempt = 1; attempt <= 2; attempt++) {
                    try {
                        const resp = await fetch(getUrl, {
                            method: 'GET',
                            mode: 'cors',
                            credentials: 'omit',
                            redirect: 'follow',
                            headers: {
                                'Accept': 'text/html, text/plain, */*'
                            }
                        });

                        if (!resp.ok) {
                            throw new Error('HTTP 狀態異常 (' + resp.status + ')');
                        }

                        htmlContent = await resp.text();
                        if (htmlContent && htmlContent.trim().length > 0) {
                            fetchError = null;
                            break;
                        } else {
                            throw new Error('報告內容為空');
                        }
                    } catch (err) {
                        fetchError = err;
                        console.warn(`第 ${attempt} 次讀取嘗試未果:`, err);
                        if (attempt < 2) {
                            await new Promise(r => setTimeout(r, 600)); // 稍候重試
                        }
                    }
                }

                if (fetchError || !htmlContent) {
                    throw new Error('無法從雲端讀取報告: ' + (fetchError ? fetchError.message : '內容為空'));
                }

                // 動態同步報告標題至外層頁面分頁
                const titleMatch = htmlContent.match(/<title[^>]*>([^<]+)<\/title>/i);
                if (titleMatch && titleMatch[1]) {
                    document.title = titleMatch[1].trim();
                }

                // 渲染至滿版 iframe (徹底解決 iOS Safari document.write 攔截與腳本凍結痛點)
                renderWithIframe(htmlContent);

            } catch (err) {
                console.error('載入失敗:', err);
                showError('報告載入失敗: ' + err.message);
            }
        }

        function renderWithIframe(html) {
            const frame = document.getElementById('report-frame');
            const loader = document.getElementById('loader');

            if (!frame) return;

            // 雙軌保底渲染：優先使用 Blob URL (iOS Safari WebKit 原生沙盒頂級相容)，降級使用 srcdoc
            let rendered = false;
            try {
                const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
                const blobUrl = URL.createObjectURL(blob);
                
                frame.onload = () => {
                    if (loader) loader.style.display = 'none';
                    frame.style.display = 'block';
                };

                frame.src = blobUrl;
                rendered = true;
            } catch (blobErr) {
                console.warn('Blob URL 載入失敗，切換為 srcdoc 備用通道:', blobErr);
            }

            if (!rendered) {
                frame.srcdoc = html;
                frame.onload = () => {
                    if (loader) loader.style.display = 'none';
                    frame.style.display = 'block';
                };
                if (loader) loader.style.display = 'none';
                frame.style.display = 'block';
            }
        }

        function showError(msg) {
            const loader = document.getElementById('loader');
            if (!loader) return;
            loader.innerHTML = `
                <div style="font-size: 3rem; margin-bottom: 1rem;">⚠️</div>
                <div class="error-msg">${msg}</div>
            `;
        }

        initPreview();
    </script>
</body>
</html>
