<html lang="zh-CN">

<head>
    <meta charset="UTF-8">

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Foxlink-CIBC | HTML代碼管理器</title>
    <meta name="description" content="Corporate Intelligence & Briefing Center">

    <!-- Open Graph / WhatsApp / LINE / Facebook 卡片預覽 -->

    <meta property="og:site_name" content="Foxlink-CIBC">
    <meta property="og:title" content="Foxlink-CIBC">
    <meta property="og:description" content="Corporate Intelligence & Briefing Center">
    <meta property="og:image" content="https://html.foxlink.co.in/assets/Foxlink-CIBC.jpg">

    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Foxlink-CIBC Corporate Intelligence & Briefing Center">

    <!-- Twitter Card 規格 -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Foxlink-CIBC">
    <meta name="twitter:description" content="Corporate Intelligence & Briefing Center">
    <meta name="twitter:image" content="https://html.foxlink.co.in/assets/Foxlink-CIBC.jpg">

    <!-- 使用公共 CDN 资源 -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/lucide-static@0.525.0/font/lucide.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style type="text/tailwindcss">
        @layer theme {
        :root {
            --primary-color: #2563eb;
        }
    }
    
    @layer components {
        .btn-primary {
            @apply px-4 py-2 bg-[var(--primary-color)] text-white rounded-lg hover:bg-blue-700 transition-colors;
        }
        .btn-success {
            @apply px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition-colors;
        }
        .input-field {
            @apply w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[var(--primary-color)] focus:border-transparent;
        }
    }
    
    /* 加载动画样式 */
    .loading-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.5s ease;
    }
    
    .loading-overlay.fade-out {
        opacity: 0;
        pointer-events: none;
    }
    
    .loader {
        width: 80px;
        height: 80px;
        border: 8px solid rgba(255, 255, 255, 0.3);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    
    .loading-text {
        color: white;
        font-size: 1.25rem;
        margin-top: 2rem;
        font-weight: 500;
        animation: pulse 2s ease-in-out infinite;
    }
    
    @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.6; }
    }
    
    .progress-bar {
        width: 300px;
        height: 4px;
        background: rgba(255, 255, 255, 0.3);
        border-radius: 2px;
        margin-top: 1.5rem;
        overflow: hidden;
    }
    
    .progress-fill {
        height: 100%;
        background: white;
        width: 0%;
        animation: progress 2s ease-in-out infinite;
    }
    
    @keyframes progress {
        0% { width: 0%; }
        50% { width: 70%; }
        100% { width: 100%; }
    }
    
    .input-field {
        width: 100%;
        padding: 0.75rem;
        border: 1px solid #cbd5e1;
        border-radius: 0.5rem;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-field:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
    }
    .preview-frame {
        width: 100% !important;
        height: 100% !important;
        min-height: 480px;
        border: 1px solid #e2e8f0;
        border-radius: 0.5rem;
        background-color: #ffffff;
    }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel" src="utils/reportsLoader.js"></script>
    <script type="text/babel" src="components/LoadingProgress.js"></script>
    <script type="text/babel" src="components/Pagination.js"></script>
    <script type="text/babel" src="components/SearchBar.js"></script>
    <script type="text/babel" src="components/CategoryTabs.js"></script>
    <script type="text/babel" src="components/PageCard.js"></script>
    <script type="text/babel" src="components/HTMLEditor.js"></script>
    <script type="text/babel" src="components/PreviewPanel.js"></script>
    <script type="text/babel" src="components/HomePage.js"></script>
    <script type="text/babel" src="app.js"></script>
</body>

</html>
